<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0D0B09" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
    <title>La Guida</title>
    <style>
      /* ── Theme tokens ────────────────────────────────────────────────────── */
      :root {
        --bg:      #0D0B09;
        --surface: #1C1814;
        --border2: #1C1814;
        --border:  #2A2520;
        --text:    #F0EBE1;
        --muted:   #4A4440;
        --dim:     #3A3530;
        --dimmer:  #2A2520;
        --accent:  #C4622D;
        --gold:    #D4A853;
        --green:   #5B8A5B;
        --red:     #8B4040;
      }
      [data-theme="light"] {
        --bg:      #FAF7F4;
        --surface: #FFFFFF;
        --border2: #F0EBE3;
        --border:  #E0D9D0;
        --text:    #1A1512;
        --muted:   #6B6560;
        --dim:     #9A9490;
        --dimmer:  #C0BAB5;
        --accent:  #C4622D;
        --gold:    #B8922A;
        --green:   #3A6A3A;
        --red:     #8B4040;
      }

      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body, #root { height: 100%; margin: 0; padding: 0; background: var(--bg); }
      body { font-family: 'DM Sans', sans-serif; color: var(--text); overflow-x: hidden; }

      /* ── Form controls ───────────────────────────────────────────────────── */
      .pg-input, .pg-select, .pg-textarea {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 11px 14px;
        font-family: 'DM Sans', sans-serif;
        font-size: 15px;
        width: 100%;
        outline: none;
        transition: border-color .2s;
        -webkit-appearance: none;
      }
      .pg-input:focus, .pg-textarea:focus { border-color: var(--accent); }
      .pg-input::placeholder, .pg-textarea::placeholder { color: var(--dim); }
      .pg-select { cursor: pointer; }
      .pg-textarea { resize: none; min-height: 88px; }

      /* ── Range slider ────────────────────────────────────────────────────── */
      .pg-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      .pg-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: 2.5px solid var(--bg);
        box-shadow: 0 0 0 3px rgba(196,98,45,.35);
        transition: box-shadow .18s;
      }
      .pg-slider:active::-webkit-slider-thumb {
        box-shadow: 0 0 0 8px rgba(196,98,45,.2);
      }
      /* Firefox thumb */
      .pg-slider::-moz-range-thumb {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: 2.5px solid var(--bg);
      }

      /* ── Page transition ─────────────────────────────────────────────────── */
      .pg-fade-in { animation: pgFade .28s ease forwards; }
      @keyframes pgFade {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: none; }
      }

      /* ── Scrollbar hiding for horizontal scroll ──────────────────────────── */
      ::-webkit-scrollbar { height: 0; width: 0; }

      /* ── Leaflet overrides (theme-aware) ─────────────────────────────────── */
      .leaflet-popup-content-wrapper {
        background: var(--surface) !important;
        color: var(--text) !important;
        border: 1px solid var(--border) !important;
        border-radius: 10px !important;
        box-shadow: 0 8px 32px rgba(0,0,0,.45) !important;
      }
      .leaflet-popup-tip { background: var(--surface) !important; }
      .leaflet-popup-close-button { color: var(--muted) !important; }
      .leaflet-control-zoom a {
        background: var(--surface) !important;
        color: var(--text) !important;
        border-color: var(--border) !important;
      }
      .leaflet-control-attribution {
        background: rgba(13,11,9,.7) !important;
        color: var(--dim) !important;
      }
      [data-theme="light"] .leaflet-control-attribution {
        background: rgba(250,247,244,.85) !important;
      }
      .leaflet-control-attribution a { color: var(--muted) !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
